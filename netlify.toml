[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  # Create React App treats warnings as errors when CI=true (Netlify's default)
  CI = "false"

# Bare /index.html should not be a second URL for the homepage
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# SPA fallback so /about, /portfolio, /reviews work on refresh or direct visit
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/resources/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
