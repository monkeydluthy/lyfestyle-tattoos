[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  # Create React App treats warnings as errors when CI=true (Netlify's default)
  CI = "false"

# Bare /index.html should not be a second URL for the homepage
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Old reviews URL. Must stay ahead of the SPA fallback.
[[redirects]]
  from = "/reviews"
  to = "/"
  status = 302

# SPA fallback so /about and /portfolio work on refresh or direct visit
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/resources/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
